<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignIn Page - DSA Learning</title>

    <!-- Font Awesome for Eye Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Link to CSS file -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to continue learning</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="input-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" placeholder="e.g. example@gmail.com">
                    <small class="error-text" id="userError" style="display: none;"></small>
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                        <i class="fa-solid fa-eye" id="togglePassword"></i>
                    </div>
                    <small class="error-text" id="passError" style="display: none;"></small>
                </div>

                <div class="remember-forgot">
                    <label class="checkbox-label">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Login</span>
                </button>

                <div class="auth-divider">
                    <span>Don't have an account?</span>
                </div>

                <a href="signup.html" class="btn btn-secondary">
                    <i class="fas fa-user-plus"></i> Create New Account
                </a>
            </form>
        </div>
    </div>

    <!-- Link to JS file -->
    <script src="js/signin.js"></script>
</body>
</html>
